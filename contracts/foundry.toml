[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true # vault math is stack-heavy
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"


[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"

# coverage: forge coverage --ir-minimum
